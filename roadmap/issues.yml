# Roadmap task definitions. ROADMAP.md is the readable summary.
# Preserve task IDs, acceptance criteria and dependencies when updating the plan.
# complete means merged; a milestone is not released until its release is published.

milestones:

  - id: M0
    title: 'v0.4.1: Maintenance'
    description: Finish the maintenance work before the next release.

  - id: M1
    title: 'v0.5: Real-world data'
    description: Make large, messy vendor registers easier to validate and adopt.

  - id: M2
    title: 'v0.6: CI integration and developer experience'
    description: Make the CLI easier to use in everyday development and CI workflows.

  - id: M3
    title: 'v0.9: Documentation and API freeze'
    description: Document the supported interfaces and settle the compatibility contract.

  - id: M4
    title: Packaging and release automation
    description: Build, verify and publish reproducible release artifacts before v1.0.

  - id: M5
    title: 'v1.0: Stable release'
    description: Prove the release candidate works from a fresh install, then complete the final reviews.
