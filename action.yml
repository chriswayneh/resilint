name: resilint
description: Offline vendor resilience checks on a vendor register (YAML or CSV)
inputs:
  file:
    description: Path to the vendor register
    required: true
  fail-on:
    description: Lowest severity that fails the step (low, medium, high, critical)
    default: high
  format:
    description: Output format (text, json, md, sarif, regmap); unknown values exit 2
    default: text
  output:
    description: Optional file to write the report to (e.g. resilint.sarif for code scanning upload)
    default: ""
  drills:
    description: Optional drill log (from `resilint drill record`) to apply before checking
    default: ""
outputs:
  findings:
    description: Number of reported findings; empty when the check fails with an error
    value: ${{ steps.check.outputs.findings }}
  highest-severity:
    description: Highest reported severity, or none for no findings; empty on error
    value: ${{ steps.check.outputs.highest-severity }}
  exit-code:
    description: CLI status (0 passes, 1 threshold findings, 2 input or output error)
    value: ${{ steps.check.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        pip install --require-hashes -r "$GITHUB_ACTION_PATH/requirements-lock.txt"
        pip install --no-deps "$GITHUB_ACTION_PATH"
    - id: check
      shell: bash
      env:
        RL_FILE: ${{ inputs.file }}
        RL_FAIL_ON: ${{ inputs.fail-on }}
        RL_FORMAT: ${{ inputs.format }}
        RL_OUTPUT: ${{ inputs.output }}
        RL_DRILLS: ${{ inputs.drills }}
        RESILINT_OUTPUT_ROOT: ${{ github.workspace }}
      run: |
        args=(check "$RL_FILE" --fail-on "$RL_FAIL_ON" --format "$RL_FORMAT")
        if [ -n "$RL_OUTPUT" ]; then args+=(--output "$RL_OUTPUT"); fi
        if [ -n "$RL_DRILLS" ]; then args+=(--drills "$RL_DRILLS"); fi
        python -I -m resilint.action "${args[@]}"
