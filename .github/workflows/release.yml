name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name != 'v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      stable: ${{ steps.metadata.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate release identity and merged history
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release_metadata.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install -e ".[dev]" build twine
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_links.py
      - run: pytest -q --cov=src/resilint --cov-fail-under=90
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/release-verify"
          "$RUNNER_TEMP/release-verify/bin/python" -m pip install --require-hashes -r requirements-lock.txt
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/release-verify/bin/python" -m pip install --no-deps --index-url https://test.pypi.org/simple/ "resilint==$RELEASE_VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 10
          done
          mkdir "$RUNNER_TEMP/release-quickstart"
          cd "$RUNNER_TEMP/release-quickstart"
          "$RUNNER_TEMP/release-verify/bin/resilint" --version
          "$RUNNER_TEMP/release-verify/bin/resilint" init vendors.yaml
          "$RUNNER_TEMP/release-verify/bin/resilint" check vendors.yaml --fail-on critical --format json --output report.json
          "$RUNNER_TEMP/release-verify/bin/python" -I - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('report.json').read_text())
          assert {f['rule_id'] for f in report['findings']} == {'RL004', 'RL005', 'RL008'}
          PY

  pypi:
    if: needs.build.outputs.stable == 'true'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
