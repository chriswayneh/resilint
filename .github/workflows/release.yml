name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name != 'v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      stable: ${{ steps.metadata.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate release identity and merged history
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release_metadata.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_links.py
      - run: pytest -q --cov=src/resilint --cov-fail-under=90
      - name: Build distributions with hash-locked packaging tools
        run: |
          python -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/build-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-build-lock.txt
          "$RUNNER_TEMP/build-tools/bin/python" -m build --no-isolation
          "$RUNNER_TEMP/build-tools/bin/python" -m twine check dist/*
      - name: Generate and validate runtime-only release evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -I -m pip --isolated install --only-binary=:all: --require-hashes --index-url https://pypi.org/simple/ -r requirements-release-lock.txt
          python -m venv "$RUNNER_TEMP/sbom-runtime"
          "$RUNNER_TEMP/sbom-runtime/bin/python" -I -m pip --isolated install --only-binary=:all: --require-hashes --index-url https://pypi.org/simple/ -r requirements-lock.txt
          "$RUNNER_TEMP/sbom-runtime/bin/python" -I -m pip --isolated install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-tools/bin/python" -m cyclonedx_py environment "$RUNNER_TEMP/sbom-runtime/bin/python" --pyproject pyproject.toml --short-PURLs --output-reproducible --validate --output-file "$RUNNER_TEMP/runtime-sbom.raw.json"
          mkdir release-assets
          python - <<'PYCODE'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          notes = changelog.split(f'## [{version}] - ', 1)[1].split('\n', 1)[1].split('\n## [', 1)[0]
          Path('release-assets/release-notes.md').write_text(notes.strip() + '\n', encoding='utf-8')
          PYCODE
          python scripts/release_evidence.py prepare "$RUNNER_TEMP/runtime-sbom.raw.json" dist release-assets "$RELEASE_VERSION"
          "$RUNNER_TEMP/release-tools/bin/python" - <<'PYCODE'
          from pathlib import Path
          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonStrictValidator
          error = JsonStrictValidator(SchemaVersion.V1_6).validate_str(Path('release-assets/resilint.cdx.json').read_text(encoding='utf-8'))
          if error:
              raise SystemExit(str(error))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Verify downloaded build identity before attesting
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/release_evidence.py verify artifacts "$RELEASE_VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/resilint.cdx.json
      - name: Retain provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir provenance
          cp -- "$BUNDLE_PATH" provenance/provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14

  testpypi:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/release-verify"
          "$RUNNER_TEMP/release-verify/bin/python" -m pip install --require-hashes -r requirements-lock.txt
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/release-verify/bin/python" -m pip install --no-deps --index-url https://test.pypi.org/simple/ "resilint==$RELEASE_VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 10
          done
          mkdir "$RUNNER_TEMP/release-quickstart"
          cd "$RUNNER_TEMP/release-quickstart"
          "$RUNNER_TEMP/release-verify/bin/resilint" --version
          "$RUNNER_TEMP/release-verify/bin/python" -I -c 'import importlib.metadata, os; assert importlib.metadata.version("resilint") == os.environ["RELEASE_VERSION"]'
          "$RUNNER_TEMP/release-verify/bin/resilint" init vendors.yaml
          "$RUNNER_TEMP/release-verify/bin/resilint" check vendors.yaml --fail-on critical --format json --output report.json
          "$RUNNER_TEMP/release-verify/bin/python" -I - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('report.json').read_text())
          assert {f['rule_id'] for f in report['findings']} == {'RL004', 'RL005', 'RL008'}
          PY

  pypi:
    if: needs.build.outputs.stable == 'true'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    if: >-
      always() && needs.attest.result == 'success' &&
      needs.verify-testpypi.result == 'success' &&
      (needs.build.outputs.stable != 'true' || needs.pypi.result == 'success')
    needs: [build, attest, verify-testpypi, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Verify exact release assets before retrieving provenance
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/release_evidence.py verify artifacts "$RELEASE_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: artifacts
      - name: Verify provenance and attach immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE: ${{ needs.build.outputs.stable }}
        run: |
          for artifact in artifacts/*.whl artifacts/*.tar.gz artifacts/resilint.cdx.json; do
            gh attestation verify "$artifact" --repo "$GH_REPO" --bundle artifacts/provenance.sigstore.json --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
          flags=()
          if [ "$STABLE" != true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file artifacts/release-notes.md "${flags[@]}" artifacts/*
