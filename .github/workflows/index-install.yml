name: Index install validation

on:
  pull_request:
    paths:
      - ".github/workflows/index-install.yml"
      - "scripts/check_index_install.py"
      - "tests/test_index_install.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact normalized TestPyPI version matching this source (for example 1.0.0rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  index-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install exact verified TestPyPI wheel and run the documented quick start
        run: python scripts/check_index_install.py
