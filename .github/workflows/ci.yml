name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_links.py
      - run: pytest -q --cov=src/resilint --cov-report=term-missing --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked packaging tools
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-build-lock.txt"
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Smoke test the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/resilint-wheel"
          "$RUNNER_TEMP/resilint-wheel/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/resilint-package-check"
          cd "$RUNNER_TEMP/resilint-package-check"
          "$RUNNER_TEMP/resilint-wheel/bin/resilint" --version
          "$RUNNER_TEMP/resilint-wheel/bin/resilint" init vendors.yaml
          "$RUNNER_TEMP/resilint-wheel/bin/resilint" check vendors.yaml --fail-on critical --format json --output report.json
          "$RUNNER_TEMP/resilint-wheel/bin/python" -I - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('report.json').read_text())
          assert {f['rule_id'] for f in report['findings']} == {'RL004', 'RL005', 'RL008'}
          PY
