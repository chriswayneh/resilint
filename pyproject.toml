[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "resilint"
version = "1.0.0"
description = "Offline lint for critical-vendor resilience commitments (DORA, NIS2, PRA SS2/21 draft mapping)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=7", "hypothesis>=6", "jsonschema>=4.18", "ruff>=0.4", "mypy>=1.8", "types-PyYAML",
       "tomli>=2; python_version < '3.11'"]

[project.scripts]
resilint = "resilint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resilint = ["templates/*.yaml"]

[tool.ruff]
line-length = 100
